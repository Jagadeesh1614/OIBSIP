<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title><link rel="stylesheet" href="auth.css"></head>
<body>
<main class="card">
 <h1>Create account</h1>
 <form id="form" novalidate>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="new-password">
  <p class="hint">At least 8 characters, including 1 number.</p>
  <button type="submit">Register</button>
 </form>
 <p class="msg" id="msg" role="alert"></p>
 <p class="alt">Already registered? <a href="login.html">Log in</a></p>
</main>
<script src="auth.js"></script>
<script>
const msg = document.getElementById('msg');
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  msg.className = 'msg';
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  if (!email || !pw) return msg.textContent = 'Fill in both fields.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg.textContent = 'Enter a valid email address.';
  if (pw.length < 8 || !/\d/.test(pw)) return msg.textContent = 'Password needs at least 8 characters and 1 number.';
  const r = await Auth.register(email, pw);
  if (!r.ok) return msg.textContent = r.error;
  msg.className = 'msg ok';
  msg.textContent = 'Account created. Redirecting to login...';
  setTimeout(() => location.href = 'login.html', 900);
});
</script>
</body></html>
